syntax = "proto3";

package braille;
option java_package = "com.semojum.backend.grpc";
option java_outer_classname = "BrailleServiceProto";
option java_multiple_files = true;

service BrailleService {
  rpc ProcessPage   (BrailleRequest)       returns (BrailleResponse);
  rpc TranslateText (TranslateTextRequest) returns (TranslateTextReply);  // [추가 08-05] 꼬리말용 짧은 묵자 → 점자. rule-based 직행, 200자 초과는 거절
}


// ── 요청 (BE → AI) ──────────────────────────────────────────────
message BrailleRequest {
  string job_id      = 1;
  int32  page_no     = 2;
  int32  total_pages = 3;   // 헤더·푸터 cross-page 감지용
  bytes  pdf_data    = 4;   // 단일 페이지 PDF (~100–500 KB)
  string mode        = 5;   // "a" | "b" | "c"
  string source_text = 6;   // mode b 전용
}

message TranslateTextRequest { // [추가 08-05] 꼬리말 점역
  string text = 1;      // 묵자 (예: "수특 사회문화 2")
}

// ── 서브메시지 ───────────────────────────────────────────────────
// 요소 위치. **좌표계 = BrailleResponse.image_resolution과 같은 픽셀 공간**(2026-08-06 명시).
// FE는 x/image_width · y/image_height로 그대로 비율 매핑한다 — 별도 보정이 필요 없다.
// (좌표계가 적혀 있지 않던 동안 MinerU 경로가 0~1000 정규화 값을 그대로 내보내
//  하이라이트가 실제 위치의 77%·65% 자리에 찍히는 사고가 있었다 — issue #75)
message BoundingBox {
  string          id            = 1;
  int32           x             = 2;   // 좌상단 x (픽셀)
  int32           y             = 3;   // 좌상단 y (픽셀)
  int32           x2            = 4;   // 우하단 x (픽셀)
  int32           y2            = 5;   // 우하단 y (픽셀)
  string          type          = 6;   // [변경 08-05] 주석만: 11종 → 분류 후 13종(cartoon·chart_graph 추가)
  int32           heading_level = 7;   // 0 = null
  string          caption_ref   = 8;   // "" = null (참조하는 element_id)
  repeated string flags         = 9;
}

message RuleTrail {
  string rule_id   = 1;
  string source    = 2;
  string section   = 3;
  string title     = 4;
  string excerpt   = 5;
  string priority  = 6;   // "primary" | "secondary"
  int32  line_no   = 7;   // [변경 08-05] 통 문자열이라 0 고정. -1 = 요소 전체
  int32  col_start = 8;   // [변경 08-05] contents[0] 안의 시작 문자 오프셋(\n도 1문자)
  int32  col_end   = 9;   // [변경 08-05] 끝 오프셋(미포함)
  string tag       = 10;  // 변환 종류 (number_sign / contraction / symbol ...)
}

message TactileGraphic {           // 미사용 — 2차 PoC(8/24) 이후 쓸 자리라 남겨 둔다
  string ascii_braille = 1;
  string svg_path      = 2;
  string target_tool   = 3;
}

message CriticalError {
  string type       = 1;  // C1~C9
  string element_id = 2;
  string message    = 3;
}

message ReviewFlag {
  string type       = 1;  // R1~R14
  string element_id = 2;
  string message    = 3;
}

message QualityReport {
  float                   ocr_confidence_avg = 1;
  // [폐기 08-05] line_overflow_rate(float, 2) 삭제
  repeated CriticalError  critical_errors    = 2; // [변경 08-05] 3 → 2
  repeated ReviewFlag     review_flags       = 3; // [변경 08-05] 4 → 3
}

message ProcessingMeta {
  int32  processing_time_ms   = 1;
  float  pdf_layer_confidence = 2;
  string routing_tier_used    = 3;   // ZERO|STANDARD|QUALITY|FALLBACK
  bool   scan_only            = 4;
}

message Draft {                     // 시각 요소의 대체 점역 초안 1개 — 점역사가 에디터에서 고른다
  string          text     = 1;     // 초안 묵자(한글). 내부 태그는 제거해 보낸다 — 사람이 읽는 값이다
  repeated string contents = 2;     // 점자 통 문자열 1항목. **mode a는 빈 배열**(점역 안 함)
  string          label    = 3;     // 피커 표시명 ("격자형" / "행↔열 전치" / "요약" ...)
}

message TextElement {
  string          id                 = 1;
  string          type               = 2;
  int32           order              = 3;
  int32           heading_level      = 4;
  float           ocr_confidence     = 5;
  string          tn_text            = 6;
  bool            is_blocked         = 7;
  string          render_mode        = 8;
  string          visual_subtype     = 9;
  float           subtype_confidence = 10;
  string          latex_string       = 11;  // formula 전용
  TactileGraphic  tactile            = 12;  // 미사용 — 2차 PoC 이후

  // 점역 결과. 항목이 **딱 하나**인 통 문자열이다(줄 배열 아님).
  //   · 줄바꿈은 `\n`. 조판 규칙은 이미 문자열 안에 들어 있다:
  //       - 구조적 빈 줄  1단계 제목 앞 2줄·뒤 1줄, 2·3단계 앞뒤 1줄, 표·그림 위아래 1줄
  //       - 들여쓰기      문단·목록 2칸, 3·4단계 제목 4칸, 2단계 제목 6칸 (점자 공백 셀)
  //       - 가운데 정렬   1단계 제목 (32칸 기준 좌우 여백)
  //   · [변경 08-06] 들여쓰기·가운데 정렬이 이 문자열에 **다시** 들어간다. 08-05 통 문자열
  //     전환 때 빠졌던 것을 되돌린 것이다 — 점자 조판 규칙은 AI가 소유한다.
  //   · 그래서 BE·FE가 할 일은 넷뿐이다: n줄 n칸으로 자르기, 면 나누기, 페이지행, 페이지
  //     변경선. 넷 다 `braille-assist`(Semojum/braille-assist)가 python·ts·java로 준다.
  //   · 요소를 order 순으로 **그냥 이어 붙이면** 지침대로 배치된다. 각 항목은 개행으로 끝난다.
  //   · 빈 요소는 빈 배열(항목 0개)이다 — 빈 문자열 1개짜리 배열이 아니다.
  repeated string    contents   = 13;

  repeated RuleTrail rule_trail = 14;  // 적용된 규정 목록. 근거 표시는 2차 PoC부터 FE가 쓴다
  repeated Draft     drafts     = 15;  // 시각 요소 대체 초안. 텍스트·수식은 빈 배열
  int32              selected_idx = 16;  // 기본 초안 번호(0-based)
}

// ── 원가 [추가 08-15] ────────────────────────────────────────────
// 관리자 대시보드의 쪽·유형별 원가와, 실제 청구서 대조에 쓴다.
//
// 설계 원칙 둘. 둘 다 실제로 데인 자리라 적어 둔다.
//
//  1. **사실과 해석을 같이 보낸다.** 토큰·모델·초는 사실이라 안 바뀌지만, 금액은
//     단가표를 곱한 해석이라 바뀐다(도입가 만료·단가 오기). BE가 사실을 저장해 두면
//     나중에 과거 데이터를 통째로 재계산할 수 있다. 금액만 저장하면 못 고친다 —
//     실제로 Claude를 부르면서 gpt-4o 단가를 곱하던 버그가 있었다(issue #176).
//
//  2. **집계 축은 (파트 × 모델)이다.** 청구서는 모델별로 나오고 대시보드는 유형별로
//     본다. 파트로만 묶으면 한 파트가 두 모델을 쓸 때(캡셔닝 sonnet + 폴백 opus)
//     토큰이 뭉개져 **어느 쪽으로도 대조가 안 된다.**
//
// ⚠ 금액 단위는 **나노(1e-9)**다:  USD = cost_usd_nanos / 1e9
//   쪽당 원가가 $0.0075·₩10.7 수준이라 센트나 원 단위로 반올림해 보내면 10만 쪽에서
//   수만 원이 어긋난다. 원(KRW)은 소수 단위가 없어 특히 위험하다.
//
// ⚠ **원화는 참고값이고 USD가 정본이다.** Anthropic·OpenAI는 USD로 청구하고, 원화
//   환산은 카드사가 **매입일**(결제일이 아니라 며칠 뒤) 환율로 한다. 요청 시점에
//   아는 환율과 다를 수밖에 없다. 청구서 대조는 USD로 한다.

enum CostPart {                    // 원가가 발생한 파이프라인 구간
  COST_PART_UNSPECIFIED = 0;       // 매핑 안 된 값(구버전 호환). 값이 사라지진 않는다
  COST_PART_EXTRACT     = 1;       // 추출 폴백(Opus) — MinerU 결과가 빈약할 때
  COST_PART_CLASSIFY    = 2;       // 시각자료 유형 분류
  COST_PART_CAPTION     = 3;       // 시각자료 캡셔닝
  COST_PART_TEXT        = 4;
  COST_PART_FORMULA     = 5;
  COST_PART_TABLE       = 6;
  COST_PART_IMAGE       = 7;
  COST_PART_CARTOON     = 8;
  COST_PART_CHART_GRAPH = 9;
  COST_PART_DIAGRAM     = 10;
  COST_PART_TAGGING     = 11;      // LLM 레이아웃 태깅(점역자주·테두리·빈칸)
  COST_PART_OTHER       = 12;      // 위 어디에도 안 붙는 호출
}

enum FxBasis {                     // 원화 환산에 쓴 수수료 배수의 근거
  FX_BASIS_UNSPECIFIED = 0;
  FX_BASIS_ESTIMATED   = 1;        // 공시 요율 추정(브랜드 1.0% + 발급사 0.3%)
  FX_BASIS_CALIBRATED  = 2;        // 실제 명세서로 실측한 값
  FX_BASIS_ENV         = 3;        // 운영에서 못 박은 값
}

// 외부 LLM 사용 1줄 = (파트 × 모델). **재계산 가능한 최소 단위**다.
message CostEntry {
  CostPart part               = 1;
  string   model              = 2;   // "claude-sonnet-5" 등 — 청구서 대조축이라 문자열 그대로
  int32    calls              = 3;
  int64    input_tokens       = 4;   // ⚠ Anthropic은 캐시 토큰을 여기 **안** 넣는다(아래 두 필드로 따로)
  int64    output_tokens      = 5;
  int64    cache_read_tokens  = 6;   // 정가의 0.1배
  int64    cache_write_tokens = 7;   // 5분 TTL 1.25배
  int64    cost_usd_nanos     = 8;   // 편의값. 단가가 바뀌면 위 토큰으로 다시 계산할 것
  bool     unpriced           = 9;   // true = 단가표에 없는 모델이라 금액이 추정치다
}

// 로컬 GPU(HyperCLOVA X) 점유. **LLM과 축이 다르다** — 토큰이 아니라 시간 안분이다.
// 인스턴스는 놀아도 24시간 과금되므로(실측 CPU 점유 0.31%) 이 합계와 월 청구서는
// 가동률만큼 벌어진다. 그래서 LLM 원가와 섞지 않고 따로 낸다.
message GpuEntry {
  CostPart part            = 1;
  int32    calls           = 2;
  int64    busy_millis     = 3;
  int64    cost_usd_nanos  = 4;
}

message CostReport {
  // 합계 — 대시보드가 바로 쓴다. entries/gpu를 더한 값과 같다.
  int64 llm_cost_usd_nanos = 1;
  int64 gpu_cost_usd_nanos = 2;
  int64 llm_cost_krw_nanos = 3;
  int64 gpu_cost_krw_nanos = 4;

  // 환산 근거 — 나중에 청구서와 어긋났을 때 **무엇을 의심할지** 알 수 있어야 한다
  double  fx_rate            = 5;   // USD→KRW 매매기준율
  double  card_markup        = 6;   // 해외 카드결제 수수료 배수 (1.013 = 1.3%)
  FxBasis fx_basis           = 7;
  int64   fx_fetched_at_ms   = 8;   // 이 환율을 언제 받았나(Unix ms). 0 = 모름
  string  pricing_version    = 9;   // 단가표 판 식별자

  repeated CostEntry entries = 10;  // 외부 LLM (파트 × 모델)
  repeated GpuEntry  gpu     = 11;  // 로컬 GPU

  // 이 **호출 1회**의 시작 시각(Unix ms). 같은 job_id·page_no로 재시도가 들어오면
  // BE가 이 값으로 시도를 구분한다. 재시도한 만큼 실제 돈은 나갔으므로,
  // 정산은 합산하고 쪽당 원가 감각은 최신 것만 보는 식으로 나눠 쓸 수 있다.
  int64 request_started_at_ms = 12;
}

// ── 응답 (AI → BE) ──────────────────────────────────────────────
message BrailleResponse {
  string job_id      = 1;
  string status      = 2;   // COMPLETED | NEEDS_REVIEW | BLOCKED
  int32  page_number = 3;

  ProcessingMeta processing_meta = 4;

  int32                   image_width         = 5;   // [복원 08-05] image_resolution(string,5) → int 두 필드. mode a, c
  int32                   image_height        = 6;   // [복원 08-05] 이 필드가 늘어 아래 번호가 하나씩 밀렸다. mode a, c
  repeated BoundingBox    bounding_box_list   = 7;   // [변경 08-05] 6 → 7. mode a, c
  repeated TextElement    text_list           = 8;   // [변경 08-06] mode a, b, c 전부. 원문(묵자). 시각 요소는 drafts에 묵자 초안(contents 빈 배열)
  repeated TextElement    braille_text_list   = 9;   // [변경 08-05] 8 → 9. mode b, c. 시각 요소 drafts는 묵자+점자 둘 다
  QualityReport           quality_report      = 10;  // [변경 08-05] 9 → 10
  // [추가 08-15] 이 호출의 원가. **BLOCKED 응답에도 실린다** — 막혔어도 돈은 나갔다.
  // LLM을 한 번도 안 부른 쪽(mode b 등)도 0으로 채운 메시지를 보낸다. 안 보내는 것과
  // 0원인 것은 다르고, BE가 그 둘을 구분하려 애쓰게 만들 이유가 없다.
  CostReport              cost_report         = 11;
}

message TranslateTextReply { // [추가 08-05] 꼬리말 점역
  string braille = 1;   // 유니코드 점자 (예: "⠠⠍⠓⠪⠁⠀⠇⠚⠽⠑⠛⠚⠧⠀⠼⠃")
}