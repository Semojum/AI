syntax = "proto3";

package braille;
option java_package = "com.semojum.backend.grpc";
option java_outer_classname = "BrailleServiceProto";
option java_multiple_files = true;

service BrailleService {
  rpc ProcessPage   (BrailleRequest)       returns (BrailleResponse);       // 원본 1쪽 점역
  rpc TranslateText (TranslateTextRequest) returns (TranslateTextReply);    // 꼬리말 점역. 200자 초과 거절
}

// ── 요청 (BE → AI) ──────────────────────────────────────────────
message BrailleRequest {
  string job_id      = 1;   // 작업 식별자
  int32  page_no     = 2;   // 원본 쪽 번호 (1-based)
  int32  total_pages = 3;   // 헤더·푸터 cross-page 감지용
  bytes  pdf_data    = 4;   // 단일 페이지 PDF (~100–500 KB)
  string mode        = 5;   // "a" | "b" | "c"
  string source_text = 6;   // mode b 전용
  bool   advanced_ai = 7;   // 고급 점역 — MinerU 대신 LLM 이 지면을 직접 읽는다
}

message TranslateTextRequest {
  string text = 1;          // 묵자 (예: "수특 사회문화 2")
}

// ── 서브메시지 ───────────────────────────────────────────────────
message BoundingBox {
  string          id            = 1;   // 요소 식별자. TextElement.id와 동일
  int32           x             = 2;   // 좌상단 x (픽셀)
  int32           y             = 3;   // 좌상단 y (픽셀)
  int32           x2            = 4;   // 우하단 x (픽셀)
  int32           y2            = 5;   // 우하단 y (픽셀)
  string          type          = 6;   // 요소 유형 13종
  int32           heading_level = 7;   // 제목 단계. 0 = null
  string          caption_ref   = 8;   // 참조 element_id. "" = null
  repeated string flags         = 9;   // 요소 단위 경고
}

message RuleTrail {
  // 2026-08-31 개편 — 필드 번호는 그대로라 선로(wire)는 호환된다. 다만 4·5의
  // 이름이 바뀌어 생성 코드의 접근자가 달라진다: getTitle→getRuleName,
  // getExcerpt→getContents. BE·FE 는 재생성 후 호출부를 함께 고쳐야 한다.
  string rule_id     = 1;   // 규정 식별자 (예: "MCST-한글-6.13.56")
  string source      = 2;   // 출처 문서명
  string section     = 3;   // 조·항 위치. path 를 " · " 로 합친 표시용 한 줄
  string rule_name   = 4;   // 조항 명칭 (위계 최하단 이름). 옛 이름 title
  string contents    = 5;   // 조항 원문. 옛 이름 excerpt
  string priority    = 6;   // "primary" | "secondary"
  int32  line_no     = 7;   // 통 문자열이라 0 고정. -1 = 요소 전체
  int32  col_start   = 8;   // contents[0] 안의 시작 오프셋
  int32  col_end     = 9;   // 끝 오프셋 (미포함)
  string tag         = 10;  // 변환 종류 (number_sign / contraction / symbol ...)
  string publisher   = 11;  // 편찬 기관 (문화체육관광부 · 국립장애인도서관 · 국립특수교육원)
  int32  version     = 12;  // 그 판의 출판 연도 (2024 · 2025)
  SectionPath path   = 13;  // 조·항 위계. 없는 단계는 "" 로 온다
}

// 규정의 위계. 문서마다 있는 단계가 달라 없는 단계는 빈 문자열로 채운다.
//   한국 점자 규정  part 부터 (편이 있다)   — 한글 점자 · 제6장. … · 제13절. … · 제53항
//   점자 도서 제작 지침 / 점자 자료 제작 지침 chapter 부터 (편이 없다)
message SectionPath {
  string part         = 1;  // 편
  string chapter      = 2;  // 장
  string section      = 3;  // 절
  string paragraph    = 4;  // 항
  string subparagraph = 5;  // 조
  string item         = 6;  // 목
}

message TactileGraphic {           // 미사용. 2차 PoC 이후
  string ascii_braille = 1;
  string svg_path      = 2;
  string target_tool   = 3;
}

message CriticalError {
  // 실측(16,346쪽, 2026-08-18) 발생: C5(1,241)·C2(63). C1·C7도 나옴(타임아웃·전체 실패).
  // 그 외 번호는 아직 관측 안 됨 — 오기 전까지 분기 안 만들어도 되나, C2는 이미 온다.
  // C2 = 콘텐츠 블록 처리 실패(치명).
  string type       = 1;
  string element_id = 2;    // 원인 요소. 쪽 전체면 ""
  string message    = 3;    // 한국어 사유 문구
}

message ReviewFlag {
  // 실측(16,346쪽, 2026-08-18) 발생 순: R1(62,328)·R13(26,076)·R14(8,328)·R11(7,537)·
  // R10(934)·R2(154)·R5(81). R7(세로쓰기)은 코드에 있으나 0건.
  // R2 = 시각자료 세분류 불확실. R5 = 초안에 원본 수치 누락(변조 검토 필요).
  // R13은 경고가 아니라 등급(요소 40%에 붙음, FE는 다른 표시 방식으로 렌더).
  string type       = 1;
  string element_id = 2;    // 대상 요소
  string message    = 3;    // 한국어 사유 문구
}

message QualityReport {
  float                   ocr_confidence_avg = 1;   // 쪽 평균 OCR 신뢰도
  repeated CriticalError  critical_errors    = 2;   // 치명 오류. 비면 정상
  repeated ReviewFlag     review_flags       = 3;   // 검토 권고
}

message ProcessingMeta {
  int32  processing_time_ms   = 1;   // 처리 시간
  float  pdf_layer_confidence = 2;   // PDF 텍스트 레이어 신뢰도
  string routing_tier_used    = 3;   // ZERO|STANDARD|QUALITY|FALLBACK
  bool   scan_only            = 4;   // 텍스트 레이어 없는 스캔본
}

message Draft {                     // 시각 6안(기본 selected_idx=2 개조식)·표 4안. 개수 하드코딩 금지
  string          text     = 1;     // 초안 묵자. 들여쓰기는 실제 공백으로 환산됨
  repeated string contents = 2;     // 초안 점자. mode a는 빈 배열
  string          label    = 3;     // 피커 표시명 ("생략" / "개조식 설명" / "행↔열 전치" ...)
  // 2026-09-02 신설. 그 안의 **태그가 살아 있는** 묵자다 — `<!주>`·`<!2칸>`.
  // 종전에는 요소 하나에 `TextElement.tn_text` 한 값뿐이라 **처음 고른 안의 것**만 담겼고,
  // 점역사가 '만화'에서 '참조'로 바꿔도 화면 위칸이 만화 대사 그대로였다(대표 지적).
  // FE 는 고른 안의 이 값을 위칸에 그린다. `TextElement.tn_text` 는 그대로 두어 호환된다.
  string          tn_text  = 4;
}

message TextElement {
  string          id                 = 1;    // 요소 식별자
  string          type               = 2;    // 요소 유형 13종
  int32           order              = 3;    // 읽기 순서. mode b는 원본 줄 번호
  int32           heading_level      = 4;    // 제목 단계. 0 = null
  float           ocr_confidence     = 5;    // 요소 OCR 신뢰도
  string          tn_text            = 6;    // 점역자 주. 없으면 ""
  bool            is_blocked         = 7;    // 이 요소만 처리 실패
  string          render_mode        = 8;    // 조판 방식 (table_grid / linear / narrative ...)
  string          visual_subtype     = 9;    // 도표 세분류 (개념도 / 흐름도 ...)
  float           subtype_confidence = 10;   // 세분류 신뢰도
  string          latex_string       = 11;   // formula 전용 원본 LaTeX
  TactileGraphic  tactile            = 12;   // 미사용. 2차 PoC 이후
  repeated string    contents        = 13;   // 본문. 통 문자열 1항목, 조판 규칙 포함
  repeated RuleTrail rule_trail      = 14;   // 적용된 규정 목록
  repeated Draft     drafts          = 15;   // 시각 요소 대체 초안. 텍스트·수식은 빈 배열
  int32              selected_idx    = 16;   // 기본 초안 번호 (0-based)
}

// ── 사용량 ──────────────────────────────────────────────────────
// [변경 0817] AI는 측정값(토큰·시간·유형)만 보냄. 금액·크레딧은 BE가 관리 변수로 계산
enum PageLayoutType {               // 쪽 대표 유형. 원가 통계와 크레딧 배율의 축
  PAGE_LAYOUT_UNSPECIFIED = 0;      // 판정 불가. 요소 없는 쪽 (크레딧 0 — 차감 0도 로그에 남길 것)
  PAGE_LAYOUT_TEXT        = 1;      // 본문 위주
  PAGE_LAYOUT_FORMULA     = 2;      // 수식 포함
  PAGE_LAYOUT_TABLE       = 3;      // 표 포함
  PAGE_LAYOUT_VISUAL      = 4;      // 그림·만화·차트·도표 포함
}

message ModelUsage {                // 모델별 LLM 사용량. BE 원가 계산의 원본
  string model         = 1;         // 모델 ID ("claude-sonnet-5" / "gpt-4o" ...). 단가표에 없으면 0원 아닌 "미확인 모델" 표시
  int32  calls         = 2;         // 호출 횟수
  int64  input_tokens  = 3;         // 입력 토큰 합계 (응답 usage 실값)
  int64  output_tokens = 4;         // 출력 토큰 합계 (응답 usage 실값)
}

message UsageReport {               // [변경 0817] 구 CostReport. 이 호출 1회의 사용량 — 전부 측정값이라 안 바뀜
  PageLayoutType layout_type = 1;   // 쪽 대표 유형. 섞이면 비싼 쪽이 이김 (그림>표>수식>본문)
  repeated ModelUsage models = 2;   // 모델별 토큰. LLM 미사용 시 빈 배열
  int64 gpu_time_ms          = 3;   // 로컬 GPU 점유 시간 합계(ms). GPU 원가 = 이 값 × BE 시간당 단가
}

// ── 응답 (AI → BE) ──────────────────────────────────────────────
message BrailleResponse {
  string job_id      = 1;   // 요청 job_id 반환
  string status      = 2;   // COMPLETED | NEEDS_REVIEW | BLOCKED
  int32  page_number = 3;   // 원본 쪽 번호
  ProcessingMeta          processing_meta     = 4;   // 처리 시간·라우팅 정보
  int32                   image_width         = 5;   // 원본 쪽 가로 픽셀. mode a, c
  int32                   image_height        = 6;   // 원본 쪽 세로 픽셀. mode a, c
  repeated BoundingBox    bounding_box_list   = 7;   // 요소 좌표. mode a, c
  repeated TextElement    text_list           = 8;   // 원문(묵자). mode a, b, c
  repeated TextElement    braille_text_list   = 9;   // 점역 결과. mode b, c
  QualityReport           quality_report      = 10;  // 품질 검사 결과
  UsageReport             usage_report        = 11;  // 사용량 관련 정보
}

message TranslateTextReply {
  string braille = 1;       // 유니코드 점자
}
