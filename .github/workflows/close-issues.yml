# develop 로 머지될 때 이슈를 닫는다.
#
# 왜 (2026-09-10)
#   GitHub 는 **기본 브랜치**로 병합될 때만 `Closes #N` 을 발화시킨다. 이 저장소의
#   기본 브랜치는 main 인데 PR 은 전부 develop 로 머지되므로, 이슈가 고쳐져도
#   영영 안 닫힌다. 실측: 열린 이슈 165건 중 137건(83.0%)이 이미 고쳐진 유령이었고,
#   그날 밤 갈래 둘이 유령을 쫓느라 0.87M 토큰을 버렸다.
#
# 무엇을 닫나
#   커밋 제목의 `[#N]` 과 본문의 `Closes|Fixes|Resolves|Refs #N`, 그리고 **그 squash 를
#   만든 PR 의 제목·본문**을 본다. 제목 끝의 `(#N)` 은 PR 번호라 이슈로 닫지 않는다.
#   이슈가 아닌 번호는 건너뛴다.
#
# PR 본문도 보는 이유 (2026-09-15)
#   squash 가 PR 본문을 커밋 메시지에 안 실어 줄 때가 있다. 실측: develop 최근 12커밋 중
#   셋(#859·#866·#867)이 본문에만 `Closes #N` 이 있어 한 건도 안 닫혔고, #857·#852·#864 를
#   사람이 손으로 닫았다. squash 커밋 제목 끝의 `(#N)` 이 그 PR 번호다.
#
# 판정 로직은 `.github/scripts/close-issues.sh` 에 있다 — 워크플로 안에 인라인으로 두면
# 돌려 볼 수가 없다. 파일로 두면 `DRY_RUN=1 RANGE=a..b` 로 실제 이력에 대고 확인할 수 있다.
name: close-issues

on:
  push:
    branches: [develop]

permissions:
  contents: read
  issues: write
  pull-requests: read      # PR 본문을 읽는다

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 커밋·PR 본문에서 이슈 번호를 뽑아 닫는다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/close-issues.sh
