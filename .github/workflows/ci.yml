name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 규약 검사 (PR에서만) ──────────────────────────────────────────
  convention:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 형식
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # docs/github/pr.md — <타입>(<범위>)?!?: 제목
          # GitHub Revert 버튼이 만드는 `Revert "..."`도 허용한다(기본값을 거스르지 않는다).
          if echo "$TITLE" | grep -qE '^Revert "'; then exit 0; fi
          if echo "$TITLE" | grep -qE '^(feat|fix|refactor|perf|test|docs|build|ci|chore|exp|revert|release)(\([a-z0-9_-]+\))?!?: .+'; then exit 0; fi
          echo "::error::PR 제목이 규약을 벗어났습니다: $TITLE"
          echo "형식: <타입>(<범위>): 제목   예) feat(worker): 페이지 처리 워커 풀 도입"
          echo "타입: feat fix refactor perf test docs build ci chore exp release"
          echo "→ docs/github/pr.md"
          exit 1

      - name: 브랜치명 형식
        env:
          BR: ${{ github.head_ref }}
        run: |
          # release/*·exp/*·revert-*는 이슈 번호를 붙이지 않는다(docs/github/start.md)
          if echo "$BR" | grep -qE '^(release/|exp/|revert-)'; then exit 0; fi
          if ! echo "$BR" | grep -qE '^(feat|fix|refactor|perf|test|docs|build|ci|chore|hotfix)/[0-9]+-[a-z0-9-]{3,}$'; then
            echo "::error::브랜치명이 규약을 벗어났습니다: $BR"
            echo "형식: <타입>/<이슈번호>-<요약>   예) feat/57-worker-pool"
            echo "→ docs/github/start.md"
            exit 1
          fi
          # feat/test·fix/all 같은 범위 불명 이름 차단
          if echo "$BR" | grep -qE '/[0-9]+-(test|all|tmp|temp|new|work|fix|update)$'; then
            echo "::error::요약이 무엇을 하는지 알려주지 않습니다: $BR"
            exit 1
          fi

      - name: type 라벨 1개
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          n=$(echo "$LABELS" | tr ',' '\n' | grep -c '^type: ' || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::'type: *' 라벨을 정확히 하나 붙여주세요 (현재 ${n}개)"
            exit 1
          fi

  # ── 변경 파일 가드 ────────────────────────────────────────────────
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경 파일 수집
        id: diff
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" --depth=50 || true
          git diff --name-only "$base"...HEAD > /tmp/changed.txt || git diff --name-only HEAD~1 > /tmp/changed.txt
          echo "변경 $(wc -l < /tmp/changed.txt)개"
          cat /tmp/changed.txt

      - name: 정답 코퍼스 보호
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # 훅은 Edit/Write만 막는다 — Bash 쓰기와 사람 손은 여기서 막는다.
          if grep -qE '^test/test_data/(input|output|dataset)/' /tmp/changed.txt; then
            if ! echo "$LABELS" | grep -q 'corpus-change'; then
              echo "::error::정답 코퍼스를 변경했습니다. 'corpus-change' 라벨 + 담당자 승인이 필요합니다."
              grep -E '^test/test_data/(input|output|dataset)/' /tmp/changed.txt | head -20
              exit 1
            fi
            echo "corpus-change 라벨 확인 — 통과"
          fi

      - name: 변경 파일 수 상한
        run: |
          # 코퍼스 2,919개 혼입 사고 재발 방지
          n=$(wc -l < /tmp/changed.txt)
          if [ "$n" -gt 300 ]; then
            echo "::error::변경 파일이 ${n}개입니다(상한 300). 생성물·데이터가 섞였는지 확인하세요."
            exit 1
          fi

      - name: 잡무 PR은 문서만
        env:
          BR: ${{ github.head_ref }}
        run: |
          # docs/github/start.md — 동작이 바뀌면 정식 절차. 잡무는 문서 파일만.
          case "$BR" in
            chore/*)
              bad=$(grep -vE '\.(md|txt|rst)$|^$' /tmp/changed.txt || true)
              if [ -n "$bad" ]; then
                echo "::notice::chore 브랜치가 문서 외 파일을 변경했습니다."
                echo "$bad"
                echo "동작이 바뀌는 변경이면 정식 이슈+브랜치로 옮겨주세요 (→ docs/github/start.md)"
              fi
              ;;
          esac

      - name: 커밋 트레일러
        run: |
          base="origin/${{ github.base_ref }}"
          if git log "$base"...HEAD --format=%B 2>/dev/null | grep -q 'Claude-Session:'; then
            echo "::error::커밋에 'Claude-Session:' 트레일러가 있습니다. 저장소가 public입니다."
            exit 1
          fi

  # ── 테스트 ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          # 점역 엔진은 requirements-ai.txt에 있지만 단위 테스트에 필수다.
          # 없으면 폴백 모드(약자·약어 미지원)로 돌아 다른 코드 경로를 검사하게 된다.
          pip install braillify==2.0.1
          # app/ 최상위에서 import하는 것들 — 없으면 테스트 수집 단계에서 24건이 깨진다.
          #   torch   : core/model_manager.py · core/health_check.py
          #   openai  : ai/captioning/captioner.py · classifier.py
          # CI에는 GPU가 없으므로 CPU 전용 휠을 쓴다(CUDA 휠은 2GB대라 매 PR마다 낭비).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install openai==1.57.4 'anthropic>=0.40,<1.0'
          pip install ruff

      - name: proto 생성
        run: bash protos/build.sh

      - name: ★ C5 배포 블로커
        run: |
          # 아라비아 숫자는 수표(⠼) 없이 점형을 시작할 수 없다.
          # 미통과 = 배포 차단 (docs/github/repo-rules.md)
          pytest test/unit_test/braille/test_rule_engine.py -q --tb=short -p no:cacheprovider

      - name: 점역 단위 게이트
        run: pytest test/unit_test/braille/ -q --tb=line -p no:cacheprovider

      - name: 전체 단위 테스트
        run: pytest test/unit_test/ -q --tb=short -p no:cacheprovider

      - name: 린터
        run: ruff check app/ test/ || true
